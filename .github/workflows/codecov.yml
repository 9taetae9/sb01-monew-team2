codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "30...80"
  status:
    project:
      default:
        target: 30%
        threshold: 10%
        informational: true
    patch:
      default:
        target: 0%
        threshold: 100%
        informational: true

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
