name: CD - Deploy To ECS

on:
  push:
    branches:
      - release*
      - release
  pull_request:
    branches:
      - release*
      - release

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY_URI: 462740558166.dkr.ecr.ap-northeast-2.amazonaws.com/team2/monew
  IMAGE_TAG: ${{ github.sha }}
  AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY2 }}
  AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY2 }}
  ECS_TASK_DEFINITION: .github/workflows/ecs/task-definition.json
  ECS_SERVICE: monew-service
  ECS_CLUSTER: monew-cluster
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execution Permission
        run: chmod +x ./gradlew
        working-directory: ./monew

      - name: Build JAR (Skip Test)
        run: ./gradlew clean build -x test
        working-directory: ./monew

      - name: AWS CLI 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ env.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
        

      - name: ECR Login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: private

      - name: Build And Push
        run: |
          docker build -t $ECR_REPOSITORY_URI:$IMAGE_TAG -t $ECR_REPOSITORY_URI:latest . --platform linux/amd64
          docker push $ECR_REPOSITORY_URI:$IMAGE_TAG
          docker push $ECR_REPOSITORY_URI:latest
        working-directory: ./monew

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: AWS CLI 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ env.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECS 테스크 정의
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: monew-app
          image: ${{ env.ECR_REPOSITORY_URI }}:${{ env.IMAGE_TAG }}

      - name: ECS 서비스 중지(프리티어 환경 고려)
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count 0
        
      - name: ECS 배포
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: ECS 서비스 다시 시작
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --desired-count 1