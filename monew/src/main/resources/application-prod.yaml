spring:
  application:
    name: monew
  data:
    mongodb:
      uri: mongodb+srv://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}/${MONGO_DB_PROD}?retryWrites=true&w=majority&appName=Cluster0
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  output:
    ansi:
      enabled: always
  sql:
    init:
      mode: never
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  batch:
    jdbc:
      initialize-schema: never # 배포 안정화 전까지 always
    job:
      name: deleteNotificationJob
      enabled: false
  boot:
    admin:
      client:
        url: http://monew-admin-app:90
    hikari:
      maximum-pool-size: 20       # 기본 10에서 증가
      minimum-idle: 5             # 유휴 연결 수 유지
      connection-timeout: 30000   # 연결 획득 타임아웃(30초)
      idle-timeout: 300000        # 유휴 연결 제거 시간(5분)
      max-lifetime: 1200000       # 연결 최대 수명(20분)
      leak-detection-threshold: 60000  # 연결 누수 감지(60초)
logging:
  level:
    root: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
  file:
    path: /var/log/monew
    name: ${logging.file.path}/application.log
    archive: ${logging.file.path}/archive
  retention-days: 14

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


