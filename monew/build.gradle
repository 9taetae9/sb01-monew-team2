plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id("org.springdoc.openapi-gradle-plugin") version "1.8.0"

}

group = 'com.codeit.team2'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'software.amazon.awssdk:s3:2.31.7'
    implementation 'cloud.localstack:localstack-sdk:0.0.1'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'


    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'com.h2database:h2'
    testImplementation 'org.instancio:instancio-junit:5.4.0'

    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    implementation 'com.squareup.okhttp3:mockwebserver:5.0.0-alpha.14'

    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    testImplementation 'org.springframework.batch:spring-batch-test'

    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // TestContainer
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // jdbc
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // jackson-dataformat-xml
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.18.3'
}

tasks.named('test') {
    useJUnitPlatform()
}

clean {
    delete file('src/main/generated')
}

// openApi - json 자동 추출
openApi {
    systemProperties = System.properties // 빌드 시 환경 변수 전달
    apiDocsUrl.set("https://localhost:8080/")
    outputDir.set(layout.buildDirectory.dir("openapi"))
}

// jacoco
jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    'com/codeit/team2/monew/config/**',
                    'com/codeit/team2/monew/module/common/exception/**',
                    'com/codeit/team2/monew/MonewApplication.class',
                    'com/codeit/team2/monew/module/domain/**/dto/**',
                    'com/codeit/team2/monew/module/domain/**/entity/**',
                    'com/codeit/team2/monew/module/domain/**/Q*.class'
            ])
        }))
    }

    dependsOn test
}

// 테스트 태스크 분리
tasks.register('unitTest', Test) {
    useJUnitPlatform {
        excludeTags 'integration'  // 'integration' 태그가 없는 테스트만 실행
    }
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'integration'  // 'integration' 태그가 있는 테스트만 실행
    }
}

tasks.register('jacocoUnitTestReport', JacocoReport) {
    executionData layout.buildDirectory.file('jacoco/unitTest.exec')
    sourceSets sourceSets.main
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/unit/jacocoUnitTestReport.xml')
    }
}

tasks.register('jacocoIntegrationTestReport', JacocoReport) {
    executionData layout.buildDirectory.file('jacoco/integrationTest.exec')
    sourceSets sourceSets.main
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/integration/jacocoIntegrationTestReport.xml')
    }
}

tasks.register('jacocoMergedReport', JacocoReport) {
    executionData files(
            layout.buildDirectory.file('jacoco/unitTest.exec'),
            layout.buildDirectory.file('jacoco/integrationTest.exec')
    )
    sourceSets sourceSets.main
    reports {
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/merged/jacocoMergedReport.xml')
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/merged/html')
    }
}

tasks.named('unitTest').configure {
    finalizedBy(tasks.named('jacocoUnitTestReport'))
}

tasks.named('integrationTest').configure {
    finalizedBy(tasks.named('jacocoIntegrationTestReport'))
}

tasks.register('allTests') {
    group = 'verification'
    description = 'Runs all tests and generates reports'
    dependsOn tasks.named('unitTest'), tasks.named('integrationTest'), tasks.named('jacocoMergedReport')
}

test {
    finalizedBy jacocoTestReport
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            enabled = false
        }
    }
}
